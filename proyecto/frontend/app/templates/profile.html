{% extends "base.html" %}

{% block content %}
<h1 class="title">
    Bienvenido, {{current_user.name}}! 

     <!-- Tarjeta de perfil -->
    <div class="card shadow p-4">
        <!-- añadir visitas...-->
        <h3 class="text-center mb-4">Perfil de usuario</h3>

        <form method="POST" action="{{ url_for('cambiar_datos', userid=current_user.id) }}">
            {{ form.hidden_tag() }}
            
            <p>Visitas: {{ current_user.visits }}</p>
            <!-- Nombre de usuario -->
            
            <div class="form-signin">
                <br>
                <label for="floatingName">Nombre de Usuario</label>
                <input class="form-control" name="newname" placeholder="{{current_user.name}}" id="newname">
            </div>

            <div class="form-signin">
                <label for="floatingEmail">Correo electrónico</label>
                <input class="form-control" name="newmail" placeholder="{{current_user.email}}" id="newmail">
            </div>
            
            <button type="submit" class="btn btn-primary ms-2">
                Cambiar
            </button>
        </form>
        
        <hr>

        <!-- Botón cambiar contraseña -->
        <button type="button" class="btn btn-danger w-100" data-bs-toggle="modal" data-bs-target="#pwdModal">
            Cambiar contraseña
        </button>
        {% if pwd_msg %}
            <br>
            <h1>{{pwd_msg}}</h1>
        {% endif %}
    </div>
</h1>

<div class="modal fade" id="pwdModal" tabindex="-1">
    <div class="modal-dialog">
        <form method="post" action="{{ url_for('cambiar_pwd', userid=current_user.id) }}">
            {{ form.hidden_tag() }}
            
            <div class="modal-content">
                <div class="modal-header">
                    <h5>Cambiar contraseña</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                
                <div class="modal-body">
                    <label>Contraseña antigua</label>
                    <input type="password" name="oldpass" class="form-control" required>
                </div>
                
                <div class="modal-body">
                    <label>Contraseña nueva</label>
                    <input type="password" name="newpass" class="form-control" required>
                </div>
                
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Cambiar</button>
                </div>
            </div>
        </form>
    </div>
</div>

{% endblock %}
