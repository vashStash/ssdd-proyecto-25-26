global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus-front'
    static_configs:
      - targets: ['localhost:9090']

  # Add your application targets here
  - job_name: 'my-app'
    static_configs:
      - targets: ['my-app:8080']
    metrics_path: /metrics
    scrape_interval: 30s